  summaryCards: `
    <div class="card">
      <div class="sk">🛍️ Shopping Guide Key Details</div>
      <ul class="slist">
        <li><strong>Canberra Centre:</strong> Bunda Street, Civic — 300+ retail outlets, cinemas, alfresco dining</li>
        <li><strong>Other centres:</strong> Westfield Shoppingtown (Belconnen), Westfield Woden (Phillip), Tuggeranong Hyperdome, Riverside Plaza (Queanbeyan)</li>
        <li><strong>Speciality:</strong> City Walk arcades + Shop Handmade (local & interstate designers); Manuka & Kingston (1920s centres, antiques, gourmet food)</li>
        <li><strong>Markets:</strong> Old Bus Depot (most Sundays + Dec Saturdays), Handmade Market (quarterly), Capital Region Farmers Market (Saturday 8–11am)</li>
      </ul>
    </div>
    <div class="card">
      <div class="sk">📌 IELTS Tip: True / False / Not Given</div>
      <ul class="slist">
        <li><strong>TRUE</strong> — the text confirms this information (maybe using different words)</li>
        <li><strong>FALSE</strong> — the text says the opposite or something clearly different</li>
        <li><strong>NOT GIVEN</strong> — the text doesn't mention this at all</li>
        <li>Watch for <strong>absolute words</strong>: "every", "all", "only", "always" — they often make a statement FALSE</li>
        <li>Don't use your <strong>own knowledge</strong> — only what the text says</li>
        <li>If you can't find the information, it's probably <strong>NOT GIVEN</strong></li>
      </ul>
    </div>`
