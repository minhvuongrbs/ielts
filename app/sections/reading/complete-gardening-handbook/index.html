    <div class="card">
      <div class="sk">🍓 How to Grow Strawberries — Key Points</div>
      <ul class="slist">
        <li><strong>Buy:</strong> Always buy certified disease-free plants; replace if disease attacks</li>
        <li><strong>Soil:</strong> Fertile soil — work in compost or manure, remove all weeds, rake in fertiliser</li>
        <li><strong>Plant:</strong> 45 cm apart in rows 75 cm apart; spread roots on mound, crown level with surface</li>
        <li><strong>Care:</strong> Feed with sulphate of potash in spring; use mats or straw to keep fruit clean</li>
        <li><strong>First year:</strong> Remove flowers so plants establish before fruiting</li>
        <li><strong>Propagate:</strong> Peg runners into pots of compost; sever from parent after 6 weeks</li>
      </ul>

      <div class="sk">📌 IELTS Tip: Sentence Completion</div>

        <li>Read the incomplete sentence and <strong>predict</strong> what kind of word is missing</li>
