<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IELTS Listening — Sentence Completion — Marathon Tips</title>
<link rel="stylesheet" href="../../../shared/styles.css">
<link rel="stylesheet" href="../../../shared/listening.css">
</head>
<body data-depth="3" data-active="listening">
<nav id="nav"></nav>
<script src="../../../shared/nav.js"></script>
<div id="app"></div>
<script>
const CAT_LABELS={event:'🏃 Event',preparation:'📋 Preparation',clothing:'👕 Clothing',safety:'⚠️ Safety'};
</script>
<script src="../../../shared/data.js"></script>
<script src="../../../shared/lesson.js"></script>
<script src="../../../shared/listening.js"></script>
<script>
renderListeningPage({
  title: 'Sentence Completion — Marathon Tips',
  sub: 'IELTS Listening — Section 2 — Revision Test',
  guideWhat: 'Sentence Completion',
  practiceTab: { audioSrc: '../../../../assets/audio/marathon-tips-listening-s2.mp3' },
  phrasesIntro: "Common phrases you'll hear in Section 2 talks and announcements. Learn to recognize these signal words."
});

let PRACTICE={};

function renderPractice(){
  const P=PRACTICE;if(!P.questions)return;
  let html=`<div class="card">
    <div class="practice-title">${P.title}</div>
    <p class="practice-instruction">${P.instruction}</p>
  </div>
  <div class="sent-list">`;
  P.questions.forEach(q=>{
    html+=`<div class="sent-card" id="sc-${q.q}">
      <div class="sent-text">
        <span class="sent-num">${q.q}.</span>
        ${q.before} <input class="sent-input" id="pq-${q.q}" autocomplete="off" spellcheck="false"> <span class="sent-answer" id="pa-${q.q}"></span>${q.after?' '+q.after:''}
      </div>
    </div>`;
  });
  html+=`</div>`;
  document.getElementById('practice-content').innerHTML=html;
  document.getElementById('practice-score').className='practice-score';
  document.getElementById('practice-score').textContent='';
  document.getElementById('pcheck').style.display='inline-block';
  document.getElementById('preset').style.display='none';
}

function checkPractice(){
  const allQ=PRACTICE.questions;
  let score=0;
  allQ.forEach(q=>{
    const inp=document.getElementById(`pq-${q.q}`);
    const ans=document.getElementById(`pa-${q.q}`);
    const card=document.getElementById(`sc-${q.q}`);
    if(!inp)return;
    const val=normalize(inp.value);
    const correct=normalize(q.answer);
    const alts=(q.altAnswers||[]).map(a=>normalize(a));
    const ok=val===correct||alts.includes(val);
    if(ok)score++;
    inp.disabled=true;
    inp.classList.add(ok?'pc':'pw');
    card.classList.add(ok?'pc':'pw');
    if(!ok){ans.textContent='✓ '+q.answer;ans.classList.add('show');}
  });
  const el=document.getElementById('practice-score');
  el.textContent=`${score} / ${allQ.length} correct`+(score===allQ.length?' 🎉':'');
  el.className='practice-score show '+(score>=allQ.length*0.7?'good':'bad');
  document.getElementById('pcheck').style.display='none';
  document.getElementById('preset').style.display='inline-block';
}

function resetPractice(){renderPractice();}

DataLayer.getLesson('listening','sentence-completion').then(data=>{
  PRACTICE=data.practice||{};
  initListening(data);
  renderPractice();
});
</script>
</body>
</html>
