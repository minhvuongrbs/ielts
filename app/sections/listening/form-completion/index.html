<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IELTS Listening — Form Completion — Furniture Ordering</title>
<link rel="stylesheet" href="../../../shared/styles.css">
<link rel="stylesheet" href="../../../shared/listening.css?v=2">
</head>
<body data-depth="3" data-active="listening">
<nav id="nav"></nav>
<script src="../../../shared/nav.js"></script>
<div id="app"></div>
<script>
const CAT_LABELS={furniture:'🪑 Furniture',payment:'💳 Payment',delivery:'🚚 Delivery',office:'🏢 Office'};
</script>
<script src="../../../shared/data.js"></script>
<script src="../../../shared/lesson.js"></script>
<script src="../../../shared/listening.js?v=2"></script>
<script>
renderListeningPage({
  title: '📋 Form Completion — Furniture Ordering',
  sub: 'IELTS Listening — Section 1 — Revision Test',
  source: 'IELTS Reading & Writing GT Book — Listening Test',
  guideWhat: 'Form Completion',
  practiceTab: { audioSrc: '../../../../assets/audio/kt-furniture-listening-s1.mp3' },
  phrasesIntro: "Common sentences you'll hear in Section 1 ordering conversations. Learn to recognize these patterns."
});

let PRACTICE={};

function renderPractice(){
  const P=PRACTICE;if(!P.formQuestions)return;
  let html='';
  html+=`<div class="ielts-form">
    <div class="ielts-form-header"><h3>${P.title}</h3><h4>${P.subtitle}</h4></div>
    <div class="form-section-title">Customer details</div>
    <p class="practice-instruction">${P.formInstruction}</p>
    <div class="form-example"><em>Example</em><br><strong>${P.example.label}:</strong> <span style="text-decoration:underline">${P.example.value}</span></div>`;
  P.formQuestions.forEach(fq=>{
    html+=`<div class="form-row">
      <div class="form-label">${fq.label}</div>
      <div class="form-q">
        <span class="form-q-num">${fq.q}</span>
        ${fq.before?`<span>${fq.before}</span>`:''}
        <input class="form-input" id="pq-${fq.q}" data-q="${fq.q}" autocomplete="off" spellcheck="false">
        <span class="form-answer" id="pa-${fq.q}"></span>
        ${fq.after?`<span class="form-suffix">${fq.after}</span>`:''}
      </div>
    </div>`;
  });
  html+=`</div>`;
  html+=`<div class="ielts-table-section"><h3>Questions 6–10</h3>
    <p class="practice-instruction">${P.tableInstruction}</p>
    <div class="ielts-table-wrap"><table class="ielts-table">
    <thead><tr>${P.tableColumns.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>`;
  P.tableRows.forEach(row=>{
    html+='<tr>';
    P.tableColumns.forEach(col=>{
      const cell=row[col];
      if(typeof cell==='object'&&cell&&cell.q){
        html+=`<td><span class="table-q-num">${cell.q}</span><input class="table-input" id="pq-${cell.q}" data-q="${cell.q}" autocomplete="off" spellcheck="false"><span class="table-answer" id="pa-${cell.q}"></span></td>`;
      } else { html+=`<td>${cell||'—'}</td>`; }
    });
    html+='</tr>';
  });
  html+=`</tbody></table></div></div>`;
  document.getElementById('practice-content').innerHTML=html;
  document.getElementById('practice-score').className='practice-score';
  document.getElementById('practice-score').textContent='';
  document.getElementById('pcheck').style.display='inline-block';
  document.getElementById('preset').style.display='none';
}

function checkPractice(){
  const allQ=[...PRACTICE.formQuestions];
  PRACTICE.tableRows.forEach(row=>{
    PRACTICE.tableColumns.forEach(col=>{
      const cell=row[col];
      if(typeof cell==='object'&&cell&&cell.q)allQ.push(cell);
    });
  });
  let score=0;
  allQ.forEach(q=>{
    const inp=document.getElementById(`pq-${q.q}`);
    const ans=document.getElementById(`pa-${q.q}`);
    if(!inp)return;
    const val=normalize(inp.value);
    const correct=normalize(q.answer);
    const alts=(q.altAnswers||[]).map(a=>normalize(a));
    const ok=val===correct||alts.includes(val);
    if(ok)score++;
    inp.disabled=true;
    inp.classList.add(ok?'pc':'pw');
    if(!ok){ans.textContent='✓ '+q.answer;ans.classList.add('show');}
  });
  const el=document.getElementById('practice-score');
  el.textContent=`${score} / ${allQ.length} correct`+(score===allQ.length?' 🎉':'');
  el.className='practice-score show '+(score>=allQ.length*0.7?'good':'bad');
  document.getElementById('pcheck').style.display='none';
  document.getElementById('preset').style.display='inline-block';
  enableScript();
}

function resetPractice(){renderPractice();disableScript();}

DataLayer.getLesson('listening','form-completion').then(data=>{
  PRACTICE=data.practice||{};
  initListening(data);
  renderPractice();
  setupScript(PRACTICE.transcript);
});
</script>
</body>
</html>
