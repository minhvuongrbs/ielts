<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IELTS Reading — On the City Doorstep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../shared/styles.css">
<link rel="stylesheet" href="../../../shared/reading.css">
<style>
/* Park cards + multi-letter select (unique to matching-information lessons) */
.parks-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.park-card{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:18px 20px;border-left:4px solid var(--accent)}
.park-card.highlight{background:var(--accent-light)}
.park-header{display:flex;align-items:flex-start;gap:12px;margin-bottom:10px}
.park-badge{font-family:'Fraunces',serif;font-weight:700;font-size:1.1rem;color:#fff;background:var(--accent);width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;transition:transform .15s}
.park-badge:hover{transform:scale(1.1)}
.park-name{font-family:'Fraunces',serif;font-weight:700;font-size:.98rem;line-height:1.3}
.park-dist{font-size:.78rem;color:#8a7a66;font-style:italic;margin-top:2px}
.park-text{font-size:.88rem;line-height:1.6;color:var(--text)}
.park-vi{display:none;font-size:.83rem;color:var(--vi);font-style:italic;margin-top:8px;padding:8px 12px;background:var(--vi-bg);border-radius:6px;border-left:3px solid var(--vi)}
.park-vi.show{display:block}
.letter-opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.lo{width:36px;height:36px;border:2px solid #e0d6c8;border-radius:8px;background:#fff;font-family:'Fraunces',serif;font-weight:700;font-size:.95rem;cursor:pointer;transition:.2s;color:var(--text);display:flex;align-items:center;justify-content:center}
.lo:hover{border-color:var(--accent);background:var(--accent-light)}
.lo.sel{border-color:var(--accent);background:var(--accent);color:#fff}
.lo.ca{border-color:var(--correct);background:var(--correct);color:#fff}
.lo.wa{border-color:var(--wrong);background:var(--wrong);color:#fff}
.lo:disabled{cursor:default}
.iq-req{font-size:.78rem;color:#8a7a66;font-style:italic;margin-top:4px}
@media(max-width:900px){.parks-grid{grid-template-columns:1fr}}
</style>
</head>
<body data-depth="3">
<nav id="nav"></nav>
<script src="../../../shared/nav.js"></script>
<div id="app"></div>
<script>
const CAT_LABELS={A:'Nambung',B:'Yanchep',C:'Walyunga',D:'John Forrest',E:'Beelu',F:'Serpentine',G:'Shoalwater'};
const IELTS_OPTIONS=null;
</script>
<script src="../../../shared/data.js"></script>
<script src="../../../shared/lesson.js"></script>
<script src="../../../shared/reading.js"></script>
<script>
renderReadingPage({
  title: 'On the City Doorstep',
  sub: 'IELTS General Training — Reading Section 1 — Practice 2.1',
  passageRight: 'ielts',
  passageLabel: '📝 Questions 1–5: Matching Information',
  passageInstruction: 'Write the correct letter, <strong>A–G</strong>. You may use any letter more than once.',
  ieltsInstruction: 'Write the correct letter, <strong>A–G</strong>, for each question. You may use any letter more than once.',
  phrasesIntro: 'Useful phrases from tourism and travel texts that you can reuse in IELTS Writing & Speaking.',
  summaryCards: `
    <div class="card">
      <div class="sk">🏞️ Passage Key Details</div>
      <ul class="slist">
        <li><strong>Topic:</strong> Seven national parks near Perth, Western Australia</li>
        <li><strong>Parks:</strong> Nambung (A), Yanchep (B), Walyunga (C), John Forrest (D), Beelu (E), Serpentine (F), Shoalwater (G)</li>
        <li><strong>Activities:</strong> Bushwalking, picnicking, wildlife observation, canoeing, diving, snorkelling</li>
        <li><strong>Highlights:</strong> The Pinnacles (A), Crystal Cave (B), Echidna Trail panoramas (C), Swan View Tunnel (D), Penguin Island (G)</li>
      </ul>
    </div>
    <div class="card">
      <div class="sk">📌 IELTS Tip: Matching Information</div>
      <ul class="slist">
        <li><strong>Read all texts quickly first</strong> to get an overview of each paragraph</li>
        <li><strong>Find keywords</strong> in the question, then scan the texts for related ideas</li>
        <li>The text won't use the <strong>exact same words</strong> — look for paraphrases</li>
        <li>Some questions may require <strong>multiple answers</strong> — read the instructions carefully</li>
        <li>You may use a letter <strong>more than once</strong></li>
      </ul>
    </div>`
});

/* ── Custom overrides: park card passage + multi-letter matching info ── */
function renderPassage() {
  document.getElementById('passage-card').innerHTML = `
    <div style="padding:0 0 12px;margin-bottom:12px;border-bottom:1px solid var(--accent-light)">
      <div style="font-family:'Fraunces',serif;font-weight:700;font-size:1rem;color:var(--accent);margin-bottom:4px">Looking for somewhere to go this long weekend?</div>
      <div style="font-size:.9rem;color:#6b5e4f">Try these West Australian national parks. They are closer to home than you think!</div>
    </div>
    <div class="parks-grid">${sections.map(p => `
      <div class="park-card" id="park-${p.id}">
        <div class="park-header">
          <div class="park-badge" onclick="highlightPark('${p.id}')">${p.id}</div>
          <div><div class="park-name">${p.name}</div><div class="park-dist">📍 ${p.distance}</div></div>
        </div>
        <div class="park-text">${p.text}</div>
        <div class="park-vi" data-vi>${p.vietnamese}</div>
      </div>`).join('')}
    </div>`;
}

function highlightPark(id) {
  document.querySelectorAll('.park-card').forEach(c => c.classList.remove('highlight'));
  const el = document.getElementById('park-' + id);
  if (el) { el.classList.add('highlight'); el.scrollIntoView({behavior:'smooth',block:'nearest'}); setTimeout(() => el.classList.remove('highlight'), 2000); }
}

function toggleLetter(btn, prefix) {
  const q = btn.dataset.q, qData = IQ.find(x => x.number == q);
  const ctn = document.getElementById((prefix==='p'?'pilo-':'ilo-') + q);
  const sel = ctn.querySelectorAll('.lo.sel');
  if (btn.classList.contains('sel')) btn.classList.remove('sel');
  else if (sel.length < qData.count) btn.classList.add('sel');
}

function renderLetterIELTS(prefix, ctnId) {
  document.getElementById(ctnId).innerHTML = IQ.map(q => {
    const req = q.count===1 ? 'Select 1 letter' : `Select ${q.count} letters`;
    const compact = prefix==='p';
    return `<div class="card" style="margin-bottom:${compact?'10':'14'}px${compact?';padding:14px 16px':''}" id="${prefix}iq-${q.number}">
      <div class="qn">${compact?'Q':'Question '}${q.number}</div>
      <div class="qtx" style="font-size:${compact?'.88':'.95'}rem">${q.text}</div>
      <div class="letter-opts" id="${prefix}ilo-${q.number}">
        ${['A','B','C','D','E','F','G'].map(l => `<button class="lo" data-q="${q.number}" data-l="${l}" onclick="toggleLetter(this,'${prefix}')">${l}</button>`).join('')}
      </div>
      <div class="iq-req">${req}</div>
      <div class="exp" id="${prefix}iexp-${q.number}"></div>
    </div>`;
  }).join('');
}

function checkLetterIELTS(prefix, bannerId, checkId, redoId) {
  let correct = 0;
  IQ.forEach(q => {
    const ctn = document.getElementById(prefix+'ilo-'+q.number), card = document.getElementById(prefix+'iq-'+q.number), exp = document.getElementById(prefix+'iexp-'+q.number);
    const btns = ctn.querySelectorAll('.lo'), sel = Array.from(ctn.querySelectorAll('.lo.sel')).map(b => b.dataset.l);
    btns.forEach(b => { b.disabled=true; b.classList.remove('sel'); });
    const ok = q.count===1 ? sel.length===1&&q.answer.includes(sel[0]) : sel.length===q.count&&sel.filter(l=>q.answer.includes(l)).length===q.count;
    btns.forEach(b => { if(q.answer.includes(b.dataset.l)) b.classList.add('ca'); else if(sel.includes(b.dataset.l)) b.classList.add('wa'); });
    if(ok){ correct++; card.classList.add('correct'); exp.className='exp show ce'; }
    else { card.classList.add('wrong'); exp.className='exp show we'; }
    exp.innerHTML = `<strong>${ok?'✓ Correct':'✗ Incorrect'}</strong> — ${q.explanation}<br><span style="color:var(--vi)">${q.vietnamese}</span>`;
  });
  const total = IQ.length, b = document.getElementById(bannerId);
  b.className='banner show';
  b.style.background = correct===total?'var(--correct-bg)':correct>=total/2?'#fffbe6':'var(--wrong-bg)';
  b.style.color = correct===total?'var(--correct)':correct>=total/2?'#7a6200':'var(--wrong)';
  b.textContent = `${correct}/${total} correct`;
  document.getElementById(checkId).style.display='none'; document.getElementById(redoId).style.display='';
}

function renderIELTS() { renderQTInfo(); renderLetterIELTS('i','ielts-ctn'); }
function checkIELTS() { checkLetterIELTS('i','ielts-banner','ic','ir'); }
function resetIELTS() { renderIELTS(); document.getElementById('ielts-banner').className='banner'; document.getElementById('ic').style.display=''; document.getElementById('ir').style.display='none'; }

function renderPassageIELTS() { renderLetterIELTS('p','passage-ielts-ctn'); }
function checkPassageIELTS() { checkLetterIELTS('p','passage-ielts-banner','pic','pir'); }
function resetPassageIELTS() { renderPassageIELTS(); document.getElementById('passage-ielts-banner').className='banner'; document.getElementById('pic').style.display=''; document.getElementById('pir').style.display='none'; }

DataLayer.getLesson('reading','on-the-city-doorstep').then(initReading);
</script>
</body>
</html>
