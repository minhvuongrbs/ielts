<script>
renderReadingPage({
  title: 'Travel This Summer',
  sub: 'IELTS General Training — Reading Section 1 — Practice 2.2',
  stPreline: true,
  passageRight: 'ielts',
  passageLabel: '📝 Questions 5–10: True / False / Not Given',
  passageInstruction: 'Do the following statements agree with the information in the advertisement?',
  ieltsInstruction: 'Do the following statements agree with the information in the advertisement? Write TRUE, FALSE, or NOT GIVEN.',
  phrasesIntro: 'Useful phrases from travel advertisements that you can reuse in IELTS Writing & Speaking.',
  summaryCards: `
    <div class="card">
      <div class="sk">✈️ Ad Key Details</div>
      <ul class="slist">
        <li><strong>Organisation:</strong> International Student Volunteers (ISV)</li>
        <li><strong>Duration:</strong> Two weeks to three months</li>
        <li><strong>Volunteer projects:</strong> Sea turtle conservation, rainforest regeneration, teaching English, elephant conservation, home and community building</li>
        <li><strong>Adventure activities:</strong> White water rafting, African wildlife safaris, scuba/snorkelling, horseback riding to hidden waterfalls</li>
        <li><strong>Info meeting:</strong> THIS Thursday, April 7th — building 401, room 155, every hour on the hour (9am–5pm)</li>
        <li><strong>Apply:</strong> www.isvonline.org | PO Box 2169, Bondi Junction, NSW 1355, Australia</li>
      </ul>
    </div>
    <div class="card">
      <div class="sk">📌 IELTS Tip: True / False / Not Given</div>
      <ul class="slist">
        <li><strong>TRUE</strong> — the text confirms this information (maybe using different words)</li>
        <li><strong>FALSE</strong> — the text says the opposite or something clearly different</li>
        <li><strong>NOT GIVEN</strong> — the text doesn't mention this at all</li>
        <li>Watch for <strong>absolute words</strong>: "every", "only", "always" — they often make a statement FALSE</li>
        <li>Watch for <strong>time words</strong>: "THIS Thursday" ≠ "every Thursday"</li>
        <li>Don't use your <strong>own knowledge</strong> — only what the text says</li>
      </ul>
    </div>`
});
fetch('./data.json?v=1').then(r=>r.json()).then(initReading);
</script>
