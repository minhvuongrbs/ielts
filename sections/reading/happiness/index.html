<script>
const CAT_LABELS={mindset:'🧠 Mindset',research:'🔬 Research',lifestyle:'🏠 Lifestyle'};
const IELTS_OPTIONS=['A','B','C','D','E','F','G','H','I','J','K'];
</script>
<script src="../../../shared/lesson.js"></script>
<script src="../../../shared/reading.js"></script>
<script>
renderReadingPage({
  title: 'What is Happiness?',
  sub: 'IELTS General Training — Reading Section 3 — Practice 4.2',
  passageRight: 'ielts',
  passageLabel: '📝 Questions 28–34: Matching Information',
  passageInstruction: 'Which paragraph contains the following information?',
  ieltsInstruction: 'The passage contains paragraphs A–K. Which paragraph contains the following information?',
  summaryCards: `
    <div class="card">
      <div class="sk">🧬 The Happiness Equation (3 factors)</div>
      <ul class="slist">
        <li><strong>~50%</strong> — Genetics — your "default" happiness level at birth</li>
        <li><strong>~8–15%</strong> — Life circumstances (income, where you live)</li>
        <li><strong>~35–42%</strong> — Thoughts & actions — the part YOU can control</li>
      </ul>
    </div>
    <div class="card">
      <div class="sk">🔑 Key ideas by paragraph</div>
      <ul class="slist">
        <li><strong>A</strong> — Happiness means different things to different people; common traits exist</li>
        <li><strong>B</strong> — Not money/looks/luck — deeper factors matter more</li>
        <li><strong>C</strong> — Money only matters when below the poverty line</li>
        <li><strong>D</strong> — Happy people think and act differently</li>
        <li><strong>E</strong> — Happiness improves both physical and mental health</li>
        <li><strong>F</strong> — Genetic "set-point" = ~50%; we return to baseline</li>
        <li><strong>G</strong> — Circumstances = only 8–15%</li>
        <li><strong>H</strong> — Thoughts/actions = up to 42%; you can control this</li>
        <li><strong>I</strong> — Happy people focus on good memories and practice forgiveness</li>
        <li><strong>J</strong> — Sadness is normal and even makes happiness brighter</li>
        <li><strong>K</strong> — Happiness can be trained — it's up to you</li>
      </ul>
    </div>
    <div class="card">
      <div class="sk">📌 IELTS Tip: Paragraph matching questions</div>
      <ul class="slist">
        <li>Read the <strong>questions first</strong>, then scan for the matching paragraph</li>
        <li>Look for <strong>paraphrasing</strong> — the test won't use the exact same words</li>
        <li>Focus on the <strong>main idea</strong> of each paragraph, not just keywords</li>
        <li>Paragraphs may be reused — don't cross them off</li>
      </ul>
    </div>`
});
fetch('./data.json?v=3').then(r=>r.json()).then(initReading);
</script>
</body>
