  passageLabel: '📑 Questions 28–36: Matching Headings',
  passageInstruction: 'Choose the correct heading for each section from the list below.',

  phrasesIntro: 'Useful phrases from this passage about sleep deprivation — reuse them in IELTS Writing & Speaking.',
  summaryCards: `
    <div class="card">
      <div class="sk">😴 Key Ideas by Section</div>
      <ul class="slist">
        <li><strong>1</strong> — Disasters linked to sleep deprivation (Challenger, Chernobyl, Exxon Valdez)</li>
        <li><strong>2</strong> — We need sleep for cognitive function but are sleeping less</li>
        <li><strong>3</strong> — Microsleeps: involuntary sleep while appearing awake</li>
        <li><strong>4</strong> — Fatigue causes 20% of driver deaths in NSW</li>
        <li><strong>5</strong> — Sleep loss reduces accuracy (+32% mistakes) and efficiency</li>
        <li><strong>6</strong> — Sleep deprivation harms mood: stress, anxiety, depression</li>
        <li><strong>7</strong> — Less sleep → higher BMI, hormonal changes, cardiovascular risk</li>
        <li><strong>8</strong> — Genes determine how much sleep you need — it varies</li>

      </ul>
    </div>
    <div class="card">
      <div class="sk">📑 IELTS Tip: Matching Headings</div>
      <ul class="slist">
